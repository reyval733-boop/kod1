<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Gift</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;500&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Container utama menyerupai layar HP */
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            position: relative;
            background: linear-gradient(180deg, #0b0c10 0%, #1a1a24 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* Background Bintang */
        .stars, .particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        
        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* Efek Kelopak/Partikel Jatuh */
        .falling-particle {
            position: absolute;
            background: radial-gradient(circle, rgba(255, 153, 204, 0.8) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: driftDown linear forwards;
        }

        @keyframes driftDown {
            0% { transform: translateY(-20px) translateX(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) translateX(60px) rotate(360deg); opacity: 0; }
        }

        /* Manajemen Halaman (Screen) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease-in-out;
            z-index: 2;
            padding: 20px;
            text-align: center;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
            z-index: 10;
        }

        /* Gaya Tulisan Judul */
        h1.title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #ff99cc;
            text-shadow: 0 0 15px rgba(255, 153, 204, 0.5);
            margin-bottom: 5px;
            opacity: 0;
            animation: fadeInDown 1s 0.3s forwards;
        }

        p.subtitle {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: #cccccc;
            text-transform: uppercase;
            margin-bottom: 40px;
            opacity: 0;
            animation: fadeInDown 1s 0.6s forwards;
        }

        h2.gallery-title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.3rem;
            color: #ff99cc;
            text-shadow: 0 0 10px rgba(255, 153, 204, 0.4);
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: lowercase; /* Memastikan format huruf kecil estetik seperti permintaan sebelumnya */
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tombol Navigasi */
        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            margin-top: 20px;
            z-index: 20;
            flex-shrink: 0;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ff99cc;
        }

        /* Slide 1: Animasi Bunga */
        .flower-container {
            height: 230px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .flower-svg {
            width: 150px;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.3));
        }

        .stem-anim {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: drawStem 2s 0.5s ease-out forwards;
        }
        @keyframes drawStem {
            to { stroke-dashoffset: 0; }
        }

        .pop-anim {
            opacity: 0;
            transform: scale(0);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .delay-1 { animation-delay: 1.5s; } 
        .delay-2 { animation-delay: 1.8s; } 
        .delay-3 { animation-delay: 2.1s; } 

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* SOLUSI TOTAL KOTAK SURAT: Garis buku dinamis mengunci baris teks */
        .letter-box {
            background-color: rgba(20, 20, 30, 0.7);
            /* Jarak garis pink kini dihitung otomatis berdasarkan tinggi baris teks (26px) */
            background-image: linear-gradient(rgba(255, 153, 204, 0.15) 1px, transparent 1px);
            background-size: 100% 26px; 
            background-position: 0 23px;
            border: 1px solid rgba(255, 153, 204, 0.2);
            border-left: 3px solid #ff99cc;
            padding: 0px 20px 10px 20px; 
            border-radius: 15px;
            text-align: left;
            backdrop-filter: blur(10px);
            width: 100%;
            height: auto;
            max-height: 38vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Pengunci baris teks agar selalu presisi di atas garis buku */
        .letter-box p {
            font-size: 0.85rem;
            line-height: 26px; /* Harus sama persis dengan ukuran background-size di atas */
            margin-bottom: 26px; 
            color: #eaeaea;
            letter-spacing: 0.5px;
        }

        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background-color: #ff99cc;
            margin-left: 3px;
            animation: blink 0.6s infinite alternate;
            vertical-align: middle;
        }

        @keyframes blink {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Slide 3: Konten Scroll Vertikal */
        .scroll-container {
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
        }

        .photo-gallery {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .photo-card {
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .photo-card img {
            width: 100%;
            border-radius: 10px;
            object-fit: cover;
        }

        .photo-card p {
            font-size: 0.8rem;
            margin-top: 10px;
            font-style: italic;
            color: #ff99cc;
        }

        /* Album Horizontal Geser */
        .horizontal-album {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            width: 100%;
            padding: 10px 5px 20px 5px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            flex-shrink: 0;
        }

        .horizontal-album::-webkit-scrollbar {
            display: none;
        }

        .polaroid-frame {
            flex: 0 0 75%; 
            scroll-snap-align: center;
            background: #ffffff;
            padding: 10px 10px 25px 10px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            border-radius: 4px;
            transform: rotate(-1deg);
        }

        .polaroid-frame:nth-child(2) { transform: rotate(2deg); }
        .polaroid-frame:nth-child(3) { transform: rotate(-2deg); }

        .polaroid-frame img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border: 1px solid #eeeeee;
            border-radius: 2px;
        }

        /* Slide 5: Animasi I LOVE YOU */
        .final-text-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 2.8rem;
            font-weight: bold;
            color: #ff4d94;
            letter-spacing: 2px;
            min-height: 100px;
        }

        .final-text-container .line {
            width: 3px;
            height: 50px;
            background-color: white;
            border-radius: 5px;
        }

        .heart-icon {
            font-size: 3rem;
            animation: heartbeat 1s infinite alternate;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        .fade-pop {
            animation: popText 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popText {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <div class="stars" id="stars"></div>
    <div class="particles-container" id="particles"></div>

    <div class="screen active" id="screen1">
        <h1 class="title">Special Gift</h1>
        <p class="subtitle">To Someone Special In My Life ✨</p>
        
        <div class="flower-container">
            <svg class="flower-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path class="stem-anim" d="M50 100 Q 45 70 50 40" stroke="#2ecc71" stroke-width="3" fill="none"/>
                <path class="pop-anim delay-1" style="transform-origin: 35px 70px;" d="M50 80 Q 30 70 20 50 Q 35 60 50 70" fill="#27ae60"/>
                <path class="pop-anim delay-1" style="transform-origin: 65px 65px;" d="M50 75 Q 70 60 80 40 Q 65 55 50 65" fill="#2ecc71"/>
                <circle class="pop-anim delay-2" style="transform-origin: 35px 45px;" cx="35" cy="45" r="8" fill="#f1c40f"/>
                <circle class="pop-anim delay-2" style="transform-origin: 65px 35px;" cx="65" cy="35" r="8" fill="#e74c3c"/>
                <circle class="pop-anim delay-3" style="transform-origin: 50px 25px;" cx="50" cy="25" r="12" fill="#ff7675"/>
                <circle class="pop-anim delay-3" style="transform-origin: 50px 25px;" cx="50" cy="25" r="5" fill="#ffeaa7"/>
            </svg>
        </div>

        <button class="btn" onclick="nextScreen(2)">OPEN LETTER ➔</button>
    </div>

    <div class="screen" id="screen2">
        <div class="letter-box" id="letter-box"></div>
        <button class="btn" id="btn-next-2" style="display: none;" onclick="nextScreen(3)">NEXT ➔</button>
    </div>

    <div class="screen" id="screen3">
        <h2 class="gallery-title">Gambar dan Ceritanya</h2>
        <div class="scroll-container">
            <div class="photo-gallery">
                <div class="photo-card">
                    <img src="29924.jpg" alt="Foto 1">
                    <p>Have a wonderful day!</p>
                </div>
                
                <div class="photo-card">
                    <img src="29924.jpg" alt="Foto 2">
                    <p>You're always amazing</p>
                </div>
            </div>
        </div>
        <button class="btn" onclick="nextScreen(4)">NEXT ➔</button>
    </div>

    <div class="screen" id="screen4">
        <h2 class="gallery-title">Fragmen perjalanan kita</h2>
        
        <div class="horizontal-album">
            <div class="polaroid-frame">
                <img src="29924.jpg" alt="Kenangan 1">
            </div>
            <div class="polaroid-frame">
                <img src="29924.jpg" alt="Kenangan 2">
            </div>
            <div class="polaroid-frame">
                <img src="29924.jpg" alt="Kenangan 3">
            </div>
        </div>

        <div class="letter-box" id="letter-box-2"></div>
        
        <button class="btn" id="btn-next-4" style="display: none;" onclick="nextScreen(5)">NEXT ➔</button>
    </div>

    <div class="screen" id="screen5">
        <div class="final-text-container" id="final-text-container"></div>
    </div>
</div>

<script>
    const letterParagraphs1 = [
        "Sayang, terima kasih sudah hadir dalam hidupku. Hari-hariku terasa lebih indah karena ada senyum dan cerita yang selalu kamu bagi denganku",
        "Sayang, di antara banyak hal yang aku syukuri, kamu adalah salah satu yang paling sering aku sebut dalam doa. Semoga Allah selalu menjaga dan membahagiakanmu",
        "Sayang, aku tidak tahu apa yang akan terjadi di masa depan, tapi hari ini aku tahu satu hal: aku bahagia bisa mengenal dan bersamamu"
    ];

    const letterParagraphs2 = [
        "Setiap lembar foto ini menyimpan bagian terbaik dari ceritaku, yaitu saat-saat bersamamu.",
        "Terima kasih telah menemani perjalananku sejauh ini, melewati tawa maupun hari yang sunyi.",
        "Mari kita buat ruang ingatan baru yang lebih indah, melangkah bersama tanpa pernah melepaskan genggaman. ❤️"
    ];

    // Membuat Efek Bintang di Background
    function createStars() {
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 35; i++) {
            let star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDuration = (Math.random() * 3 + 1) + 's';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }
    }

    // Membuat Efek Partikel Jatuh
    function startFallingParticles() {
        const container = document.getElementById('particles');
        setInterval(() => {
            const particle = document.createElement('div');
            particle.className = 'falling-particle';
            
            const isHeart = Math.random() > 0.6;
            if(isHeart) {
                particle.innerHTML = '❤️';
                particle.style.background = 'none';
                particle.style.fontSize = (Math.random() * 8 + 10) + 'px';
            } else {
                const size = Math.random() * 5 + 3;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
            }

            particle.style.left = Math.random() * 90 + '%';
            particle.style.animationDuration = (Math.random() * 4 + 4) + 's'; 
            
            container.appendChild(particle);
            setTimeout(() => { particle.remove(); }, 8000);
        }, 500);
    }

    createStars();
    startFallingParticles();

    // Fungsi Pindah Slide
    function nextScreen(screenNum) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen' + screenNum).classList.add('active');

        if(screenNum === 2) {
            startTypewriter('letter-box', letterParagraphs1, 'btn-next-2');
        } else if (screenNum === 4) {
            startTypewriter('letter-box-2', letterParagraphs2, 'btn-next-4');
        } else if (screenNum === 5) {
            startILoveYouAnimation();
        }
    }

    // Fungsi Efek Mengetik Lembut & Stabil Lock Garis Buku
    function startTypewriter(boxId, paragraphs, btnId) {
        const box = document.getElementById(boxId);
        if(box.innerHTML !== '') return; 
        
        box.innerHTML = ''; 
        let paraIndex = 0;
        let charIndex = 0;
        
        document.getElementById(btnId).style.display = 'none';
        
        const cursorElement = document.createElement('span');
        cursorElement.className = 'typing-cursor';

        function typeNextParagraph() {
            if (paraIndex < paragraphs.length) {
                const pElement = document.createElement('p');
                box.appendChild(pElement);
                pElement.appendChild(cursorElement);
                charIndex = 0;
                typeCharacter();
            } else {
                cursorElement.remove();
                document.getElementById(btnId).style.display = 'inline-block';
            }
        }

        function typeCharacter() {
            const currentText = paragraphs[paraIndex];
            if (charIndex < currentText.length) {
                cursorElement.insertAdjacentText('beforebegin', currentText.charAt(charIndex));
                charIndex++;
                box.scrollTop = box.scrollHeight; 
                setTimeout(typeCharacter, 60); 
            } else {
                paraIndex++;
                setTimeout(typeNextParagraph, 600); 
            }
        }

        typeNextParagraph();
    }

    // Fungsi Animasi Akhir Slide 5
    let loveInterval;
    function startILoveYouAnimation() {
        const container = document.getElementById('final-text-container');
        const states = [
            '<div class="line"></div> <span class="heart-icon fade-pop">❤️</span> <div class="line"></div>',
            '<div class="line"></div> <span class="fade-pop">I</span> <span class="heart-icon fade-pop">❤️</span> <span class="fade-pop">U</span> <div class="line"></div>',
            '<div class="line"></div> <span class="fade-pop">I</span> <span class="fade-pop">LOVE</span> <span class="fade-pop">YOU</span> <div class="line"></div>'
        ];
        
        let step = 0;
        container.innerHTML = states[step]; 

        if(loveInterval) clearInterval(loveInterval);
        loveInterval = setInterval(() => {
            step = (step + 1) % states.length;
            container.innerHTML = states[step];
        }, 1200); 
    }
</script>

</body>
</html>
